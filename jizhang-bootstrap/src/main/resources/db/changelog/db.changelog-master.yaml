  - changeSet:
      id: jizhang-1.3.0-policy-version-add
      author: jizhang
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: fin_book_member
                columnName: policy_version
      changes:
        - sql:
            sql: >-
              ALTER TABLE `fin_book_member`
              ADD COLUMN `policy_version` BIGINT UNSIGNED NOT NULL DEFAULT 0 COMMENT '成员策略乐观锁版本'
  - changeSet:
      id: jizhang-1.3.0-member-access-policy
