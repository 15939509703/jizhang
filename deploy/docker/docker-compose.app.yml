services:
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: jizhang-app
    network_mode: host
    env_file:
      - /etc/jizhang/jizhang-server.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8081
      DB_URL: "jdbc:mysql://127.0.0.1:3306/jizhang_db?createDatabaseIfNotExist=false&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false"
      DB_USERNAME: jizhang_app
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      UPLOAD_DIR: /var/lib/jizhang/uploads
      HTTP_LOG_INCLUDE_BODY: "false"
      HTTP_LOG_MAX_PAYLOAD_LENGTH: 4096
      SWAGGER_ENABLED: "false"
      TZ: Asia/Shanghai
    volumes:
      - /var/lib/jizhang/uploads:/var/lib/jizhang/uploads
    restart: unless-stopped
