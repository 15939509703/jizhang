server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: jizhang-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/jizhang_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  storage:
    upload-dir: ${UPLOAD_DIR:./data/uploads}
  logging:
    http:
      include-body: ${HTTP_LOG_INCLUDE_BODY:true}
      max-payload-length: ${HTTP_LOG_MAX_PAYLOAD_LENGTH:4096}
  wechat:
    app-id: ${WX_APP_ID}
    app-secret: ${WX_APP_SECRET}
    code2-session-url: https://api.weixin.qq.com/sns/jscode2session
  security:
    jwt:
      issuer: jizhang-server
      secret-base64: ${JWT_SECRET_BASE64}
      access-token-ttl: 30m
      refresh-token-ttl: 30d

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
  paths-to-match: /api/**

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
  level:
    root: INFO
    com.lhj.jizhang: INFO
    com.lhj.jizhang.user.mapper: WARN
